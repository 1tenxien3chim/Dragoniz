<style>
    .nav-container {
    position: relative;
    }

.hover-bg {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0;
  background-color: #007bff; /* màu nền hover */
  border-radius: 4px;
  transition: all 0.3s ease;
  z-index: 1;
}

.nav-menu {
  position: relative;
  display: flex; 
}

.menu-item {
  position: relative;
  z-index: 2; /* để hiển thị trên hover-bg */
}

.menu-link {
  display: block;
  padding: 10px 16px;
  color: #fff;
  text-decoration: none;
  position: relative;
  z-index: 2;
}
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const menu = document.querySelector('.nav-container');
    const items = document.querySelectorAll('.nav-menu > .menu-item');
    const hoverBg = document.querySelector('.hover-bg');

    items.forEach(item => {
      item.addEventListener('mouseenter', () => {
        const rect = item.getBoundingClientRect();
        const containerRect = menu.getBoundingClientRect();
        const offsetLeft = rect.left - containerRect.left;
        const width = rect.width;

        hoverBg.style.left = offsetLeft + 'px';
        hoverBg.style.width = width + 'px';
      });
    });

    menu.addEventListener('mouseleave', () => {
      hoverBg.style.width = '0';
    });
  });
</script>
